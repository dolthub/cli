name: Tests

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - '.github/workflows/go.yml'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race ./...

      - name: Build dh
        run: go build ./cmd/dh

      - name: Verify offline documentation export
        shell: bash
        run: |
          executable=./dh
          if [[ "$RUNNER_OS" == Windows ]]; then executable=./dh.exe; fi
          "$executable" generate-docs --output dist/docs
          "$executable" generate-docs --output dist/docs --check
