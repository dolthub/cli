name: Check release packaging

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/release*.yml'
      - '.github/workflows/push-docker-image.yml'
      - '.github/workflows/upload-release-assets.yml'
      - 'docker/**'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.sha }}
      version: 0.0.0
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Read Go version
        id: go
        run: echo "version=$(awk '$1 == "go" {print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: dh-test:local
          build-args: |
            DH_VERSION=0.0.0
            GO_VERSION=${{ steps.go.outputs.version }}
      - name: Smoke test image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker run --rm --platform "linux/$ARCH" dh-test:local version --short)" = 0.0.0
          docker run --rm --platform "linux/$ARCH" dh-test:local --help
