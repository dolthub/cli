name: Recover release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version, e.g. 0.1.0
        type: string
        required: true
      replace:
        description: Allow replacement of existing release assets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Recovery may target an unpublished draft release.
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(bash .github/scripts/release-version.sh "$INPUT_VERSION")
          gh release view "v$version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "v$version^{commit}")" >> "$GITHUB_OUTPUT"
  assets:
    needs: prepare
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
  upload:
    needs: [prepare, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Upload rebuilt assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$REPLACE" == true ]]; then args+=(--clobber); fi
          # Without --clobber, existing assets cause failure rather than silent replacement.
          gh release upload "v$VERSION" dist/* "${args[@]}"
