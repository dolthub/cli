name: Release DoltHub CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, e.g. 0.1.0 or v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release source
        id: prepare
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(bash .github/scripts/release-version.sh "$INPUT_VERSION")
          tag="v$version"
          sha=$(git rev-parse HEAD)
          # A retry must use the original tag, even if main has moved.
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            sha=$(git rev-parse "$tag^{commit}")
            if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
              test "$draft" = true
            fi
          fi
          git merge-base --is-ancestor "$sha" HEAD
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName --jq '.[].tagName' | sed 's/^v//' | sort -V | tail -1)
          if [[ -n "$latest" ]]; then
            test "$version" != "$latest"
            test "$(printf '%s\n' "$latest" "$version" | sort -V | tail -1)" = "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  assets:
    needs: prepare
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  draft:
    needs: [prepare, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Create tag and draft release; upload assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # Create the tag explicitly: draft releases do not publish their tags yet.
            if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
              test "$tag_sha" = "$RELEASE_SHA"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$RELEASE_SHA"
            fi
            gh release create "$tag" --verify-tag --draft --title "$VERSION" --generate-notes
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" dist/* --clobber

  docker:
    needs: [prepare, draft]
    uses: ./.github/workflows/push-docker-image.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
      promote_latest: true
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

  publish:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --prerelease=false --latest
